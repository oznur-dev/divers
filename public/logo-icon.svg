<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C4E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003C8F;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0099CC" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ana damla -->
  <path d="M100,20 C100,20 150,80 150,130 C150,160 130,180 100,180 C70,180 50,160 50,130 C50,80 100,20 100,20 Z"
        fill="url(#dropGradient)" filter="url(#softShadow)"/>

  <!-- Dalış figürü -->
  <circle cx="100" cy="60" r="9" fill="#ffffff"/>
  <path d="M100,70 L100,95 M100,77 L88,90 M100,77 L112,90 M100,95 L88,115 M100,95 L112,115"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Balıklar -->
  <g fill="#ffffff" opacity="0.65">
    <path d="M68,128 L74,123 L74,133 Z M74,128 L86,128 L86,123 L86,133 Z"/>
    <path d="M118,148 L124,143 L124,153 Z M124,148 L136,148 L136,143 L136,153 Z"/>
  </g>

  <!-- Dalgalar -->
  <path d="M58,162 Q70,156 82,162 Q94,168 106,162 Q118,156 130,162 Q142,168 154,162"
        stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>
</svg>
